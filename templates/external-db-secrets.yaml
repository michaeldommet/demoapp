{{- if and (not .Values.mysql.enabled) (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo.fullname" . }}-externaldb
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "todo.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-password: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
