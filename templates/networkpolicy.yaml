{{- if and .Values.mysql.enabled .Values.mysql.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "todo.fullname" . }}-mysql
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "todo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: todo
      ports:
        - protocol: TCP
          port: 3306
{{- end }}
