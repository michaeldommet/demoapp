# This statefulset deploys MySQL in-cluster. Use for local/kind or EKS if not using RDS/external DB.
{{- if .Values.mysql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "mysql-db"
  namespace: {{ include "common.names.namespace" . | quote }}
spec:
  replicas: 1
  selector:
    matchLabels: {{ include "common.labels.matchLabels" . | nindent 6 }}
      app: mysql
  serviceName: "mysql"
  {{- if .Values.mysql.updateStrategy }}
  updateStrategy: {{- toYaml .Values.mysql.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app: mysql
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.dbimage.repository }}:{{ .Values.mysql.dbimage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.mysql.dbimage.pullPolicy | quote }}
          {{- if .Values.mysql.primary.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.mysql.primary.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "mysql.secretName" . }}
                  key: mysql-root-password
            {{- if not (empty .Values.mysql.auth.username) }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.auth.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "mysql.secretName" . }}
                  key: mysql-password
            {{- end }}
            {{- if and .Values.mysql.auth.createDatabase .Values.mysql.auth.database }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.auth.database | quote }}
            {{- end }}
            {{- if .Values.mysql.primary.extraFlags }}
            - name: MYSQL_EXTRA_FLAGS
              value: "{{ .Values.mysql.primary.extraFlags }}"
            {{- end }}
            {{- if .Values.mysql.primary.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.mysql.primary.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          envFrom:
            {{- if .Values.mysql.primary.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.mysql.primary.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.mysql.primary.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.mysql.primary.extraEnvVarsSecret "context" $) }}
            {{- end }}
          ports:
            - name: mysql
              containerPort: 3306
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.mysql.primary.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.mysql.primary.livenessProbe "enabled") "context" $) | nindent 12 }}
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  password_aux="${MYSQL_ROOT_PASSWORD:-}"
                  if [[ -f "${MYSQL_ROOT_PASSWORD_FILE:-}" ]]; then
                      password_aux=$(cat "$MYSQL_ROOT_PASSWORD_FILE")
                  fi
                  mysqladmin status -uroot -p"${password_aux}"
          {{- else if .Values.mysql.primary.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.mysql.primary.customLivenessProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.mysql.primary.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.mysql.primary.readinessProbe "enabled") "context" $) | nindent 12 }}
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  password_aux="${MYSQL_ROOT_PASSWORD:-}"
                  if [[ -f "${MYSQL_ROOT_PASSWORD_FILE:-}" ]]; then
                      password_aux=$(cat "$MYSQL_ROOT_PASSWORD_FILE")
                  fi
                  mysqladmin status -uroot -p"${password_aux}"
          {{- else if .Values.mysql.primary.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.mysql.primary.customReadinessProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.mysql.primary.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.mysql.primary.startupProbe "enabled") "context" $) | nindent 12 }}
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  password_aux="${MYSQL_ROOT_PASSWORD:-}"
                  if [[ -f "${MYSQL_ROOT_PASSWORD_FILE:-}" ]]; then
                      password_aux=$(cat "$MYSQL_ROOT_PASSWORD_FILE")
                  fi
                  mysqladmin status -uroot -p"${password_aux}"
          {{- else if .Values.mysql.primary.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.mysql.primary.customStartupProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if .Values.mysql.primary.resources }}
          resources: {{ toYaml .Values.mysql.primary.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: custom-init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: custom-init-scripts
          configMap:
            name: {{ include "mysql.initdbScriptsCM" . }}
        - name: data
          persistentVolumeClaim:
            claimName: data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{ include "common.labels.matchLabels" . | nindent 10 }}
          app.kubernetes.io/component: primary
          {{- if .Values.commonLabels }}
          {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 10 }}
          {{- end }}
        annotations:
          {{- if .Values.mysql.primary.persistence.annotations }}
          {{- include "common.tplvalues.render" (dict "value" .Values.mysql.primary.persistence.annotations "context" $) | nindent 10 }}
          {{- end }}
          {{- if .Values.commonAnnotations }}
          {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 10 }}
          {{- end }}
      spec:
        accessModes:
          {{- range .Values.mysql.primary.persistence.accessModes }}
          - {{ . | quote }}
          {{- end }}
        resources:
          requests:
            storage: {{ .Values.mysql.primary.persistence.size | quote }}
        {{- include "common.storage.class" (dict "persistence" .Values.mysql.primary.persistence "global" .Values.global) | nindent 8 }}
        {{- if .Values.mysql.primary.persistence.selector }}
        selector: {{- include "common.tplvalues.render" (dict "value" .Values.mysql.primary.persistence.selector "context" $) | nindent 10 }}
        {{- end -}}
        {{- if .Values.mysql.primary.persistence.storageClass }}
        storageClassName: {{ .Values.mysql.primary.persistence.storageClass | quote }}
        {{- else }}
        storageClassName: "standard"
        {{- end }}
{{- end -}}
