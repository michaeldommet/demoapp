<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToDo App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>ToDo App</h1>
        <form action="/add" method="post">
            <input type="text" name="title" placeholder="Enter new task" required>
            <button type="submit">Add Task</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Task</th>
                    <th>Added</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for todo in todos %}
                <tr>
                    <td>{{ todo.title }}</td>
                    <td>{{ todo.date_created.strftime('%Y-%m-%d') }}</td>
                    <td>
                        <a href="/edit/{{ todo.id }}">Edit</a>
                        <a href="/delete/{{ todo.id }}">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
